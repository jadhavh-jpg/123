<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Generate Payment Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:#f5f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  background:#ffffff;
  width:380px;
  padding:28px;
  border-radius:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.15);
  text-align:center;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:#0D3B66;
}

.subtitle{
  margin-top:6px;
  font-size:15px;
  color:#555;
}

input{
  width:100%;
  padding:14px;
  margin-top:16px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:14px;
  background:#0D3B66;
  color:#ffffff;
  cursor:pointer;
}

button:hover{
  background:#092d4f;
}

.result{
  margin-top:18px;
  display:none;
}

.result input{
  margin-top:10px;
  font-size:14px;
}

.actions{
  margin-top:10px;
}

.actions button{
  margin-top:8px;
  background:#2FB344;
}

.note{
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <!-- HEADLINE -->
  <div class="logo">PayMoney</div>
  <div class="subtitle">Generate Payment Link</div>

  <!-- INPUTS -->
  <input type="text" id="upi" placeholder="Enter your UPI ID (example@upi)">
  <input type="number" id="amt" placeholder="Enter Amount (₹)">

  <!-- GENERATE -->
  <button onclick="generateLink()">Generate Payment Link</button>

  <!-- RESULT -->
  <div class="result" id="resultBox">
    <input type="text" id="payLink" readonly>

    <div class="actions">
      <button onclick="copyLink()">Copy Link</button>
      <button onclick="payNow()">Pay Now</button>
    </div>
  </div>

  <div class="note">
    Works with Google Pay, PhonePe, Paytm, BHIM & all UPI apps
  </div>
</div>

<script>
function generateLink(){
  var upi = document.getElementById("upi").value.trim();
  var amt = document.getElementById("amt").value;

  if(!upi || upi.indexOf("@") === -1){
    alert("Please enter a valid UPI ID");
    return;
  }
  if(!amt || amt <= 0){
    alert("Please enter a valid amount");
    return;
  }

  var link =
    "upi://pay?pa=" + encodeURIComponent(upi) +
    "&pn=PayMoney" +
    "&am=" + amt +
    "&cu=INR";

  document.getElementById("payLink").value = link;
  document.getElementById("resultBox").style.display = "block";
}

function copyLink(){
  var input = document.getElementById("payLink");
  input.select();
  document.execCommand("copy");
  alert("Payment link copied");
}

function payNow(){
  var link = document.getElementById("payLink").value;
  window.location.href = link;
}
</script>

</body>
</html>
