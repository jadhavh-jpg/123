<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Generate Payment Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:#f5f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  background:#ffffff;
  width:400px;
  padding:30px;
  border-radius:22px;
  box-shadow:0 16px 45px rgba(0,0,0,.15);
  text-align:center;
}

.logo{
  font-size:28px;
  font-weight:800;
  color:#0D3B66;
}

.subtitle{
  margin-top:6px;
  font-size:15px;
  color:#555;
}

input{
  width:100%;
  padding:15px;
  margin-top:16px;
  font-size:15px;
  border-radius:12px;
  border:1px solid #ddd;
  outline:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:16px;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:16px;
  background:#0D3B66;
  color:#ffffff;
  cursor:pointer;
}

button:hover{
  background:#092d4f;
}

.result{
  margin-top:20px;
  display:none;
}

.result input{
  margin-top:10px;
  font-size:14px;
  cursor:pointer;
}

.link-box{
  margin-top:10px;
}

.link-btn{
  display:block;
  margin-top:12px;
  padding:14px;
  background:#2FB344;
  color:#fff;
  text-decoration:none;
  border-radius:14px;
  font-weight:600;
}

#qrBox{
  display:none;
  margin-top:18px;
}

#qrBox img{
  width:220px;
}

.note{
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <!-- HEADLINE -->
  <div class="logo">PayMoney</div>
  <div class="subtitle">Generate Payment Link</div>

  <!-- INPUTS -->
  <input type="text" id="upi" placeholder="Enter your UPI ID (example@upi)">
  <input type="number" id="amt" placeholder="Enter Amount (₹)">

  <!-- GENERATE -->
  <button onclick="generateLink()">Generate Payment Link</button>

  <!-- RESULT -->
  <div class="result" id="resultBox">

    <!-- PAYMENT LINK -->
    <div class="link-box">
      <a href="#" id="payLinkBtn" class="link-btn" onclick="openPayment(event)">
        Click to Pay
      </a>
    </div>

    <!-- QR FOR DESKTOP -->
    <div id="qrBox">
      <p><b>Scan & Pay</b></p>
      <img id="qrImg">
    </div>

  </div>

  <div class="note">
    Works with all UPI apps • Mobile & Desktop supported
  </div>
</div>

<script>
var generatedLink = "";

function generateLink(){
  var upi = document.getElementById("upi").value.trim();
  var amt = document.getElementById("amt").value;

  if(!upi || upi.indexOf("@") === -1){
    alert("Please enter a valid UPI ID");
    return;
  }
  if(!amt || amt <= 0){
    alert("Please enter a valid amount");
    return;
  }

  generatedLink =
    "upi://pay?pa=" + encodeURIComponent(upi) +
    "&pn=PayMoney" +
    "&am=" + amt +
    "&cu=INR";

  document.getElementById("resultBox").style.display = "block";
  document.getElementById("qrBox").style.display = "none";
}

function openPayment(e){
  e.preventDefault();

  // Mobile → direct UPI app
  if(/Android|iPhone|iPad/i.test(navigator.userAgent)){
    window.location.href = generatedLink;
  }
  // Desktop → show QR
  else{
    var qr =
      "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
      encodeURIComponent(generatedLink);
    document.getElementById("qrImg").src = qr;
    document.getElementById("qrBox").style.display = "block";
  }
}
</script>

</body>
</html>
